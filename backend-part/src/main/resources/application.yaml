spring:
  application:
    name: backend-part

  datasource:
    url: jdbc:postgresql://localhost:5432/AI-Vulnerability-Prioritizer
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Flyway owns the schema from now on (V1 baseline + V2 foundation).
      # Hibernate only validates at startup; schema changes go through migrations.
      ddl-auto: validate
    show-sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


jwt:
    secretKey: ${JWT_SECRET}
app:
  base-url: ${BASE_URL}
  # Where the GitHub OAuth callback redirects after a successful connection.
  # Leave empty while there is no frontend: the backend then serves its own
  # success page. Once the SPA exists set it, e.g. FRONTEND_URL=http://localhost:5173,
  # and the callback redirects to <frontend>/settings/integrations?connected=github.
  frontend-url: ${FRONTEND_URL:}
github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  # Must be reachable under the SAME host the frontend uses for the backend
  # (localhost), otherwise the JSESSIONID cookie carrying the OAuth state is
  # not sent back on the callback and the flow fails with "Invalid OAuth state".
  # Keep this identical to the callback URL registered in your GitHub OAuth App.
  redirect-uri: http://localhost:8080/integrations/github/callback